repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(tests/golden/|renders/)|\.svg$'
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        files: '^\.github/(workflows/|actions/)|^\.pre-commit-config\.yaml$'
        pass_filenames: false
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format src tests scripts
        language: system
        types: [file]
        files: '(\.py$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
        pass_filenames: false
      - id: ruff-check
        name: ruff
        entry: uv run --locked ruff check src tests scripts
        language: system
        types: [file]
        files: '(\.py$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
        pass_filenames: false
      - id: ty-check
        name: ty
        entry: uv run --locked ty check src
        language: system
        types: [file]
        files: '(\.py$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
        pass_filenames: false
      - id: file-length-check
        name: file length
        entry: uv run --locked python scripts/check_file_length.py --warn-lines 500 --fail-lines 750
        language: system
        types: [python]
        pass_filenames: true
        files: "\\.py$"
        exclude: "^(scripts/|src/flo/render/_svg_sppm_edges\\.py|tests/integration/test_cli_render_options\\.py|tests/unit/test_layout_core_elk_requests\\.py|tests/unit/test_layout_core_elk_runtime\\.py|tests/unit/test_render_artifact_backends_sppm\\.py)$"
      - id: importlinter-check
        name: import-linter
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
      - id: architecture-responsibility-check
        name: architecture responsibilities (fast source check)
        entry: uv run --locked python scripts/architecture_boundaries.py
        language: system
        pass_filenames: false
      - id: docs-governance-check
        name: docs governance
        entry: uv run --locked python scripts/check_docs_governance.py --strict
        language: system
        pass_filenames: false
        files: '^(docs/|examples/|schema/|README\.md$|src/flo/errors\.py$|scripts/check_docs_governance\.py$|pyproject\.toml$|uv\.lock$|\.pre-commit-config\.yaml$)'
      - id: contract-schema-check
        name: generated contract schemas
        entry: uv run --locked python scripts/generate_contract_schemas.py --check
        language: system
        pass_filenames: false
        files: '^(src/flo/(source/|process/)|schema/|scripts/generate_contract_schemas\.py$|pyproject\.toml$|uv\.lock$|\.pre-commit-config\.yaml$)'
      - id: svg-accessibility-check
        name: SVG accessibility metadata
        entry: uv run --locked python scripts/check_svg_accessibility.py
        language: system
        pass_filenames: false
        files: '^(src/|examples/|schema/|tests/golden/|scripts/|pyproject\.toml$|uv\.lock$|package(-lock)?\.json$|\.pre-commit-config\.yaml$)'
      - id: sppm-final-geometry-check
        name: SPPM final SVG geometry
        entry: uv run --locked python scripts/check_sppm_geometry.py
        language: system
        pass_filenames: false
        files: '^(src/|examples/|schema/|tests/golden/|scripts/|pyproject\.toml$|uv\.lock$|package(-lock)?\.json$|\.pre-commit-config\.yaml$)'
      - id: sppm-golden-drift-check
        name: SPPM golden artifact drift
        entry: uv run --locked python scripts/check_sppm_baseline_drift.py
        language: system
        pass_filenames: false
        files: '^(src/|examples/|schema/|tests/golden/|scripts/|pyproject\.toml$|uv\.lock$|package(-lock)?\.json$|\.pre-commit-config\.yaml$)'
      - id: pytest-check
        name: pytest
        entry: uv run --locked pytest
        language: system
        types: [file]
        files: '^(\.github/|\.pre-commit-config\.yaml$|\.python-version$|pyproject\.toml$|uv\.lock$|package(-lock)?\.json$|src/|tests/|scripts/|examples/|schema/)'
        pass_filenames: false
