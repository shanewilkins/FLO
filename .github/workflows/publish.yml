name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

env:
  UV_LOCKED: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out
        with:
          persist-credentials: false
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_artifacts.py --tag "$RELEASE_TAG"

      - name: Install Node runtime deps (elkjs)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify elkjs runtime import
        run: node --input-type=module -e "await import('elkjs/lib/elk.bundled.js'); console.log('elkjs import ok')"

      - name: Vendor pinned elkjs runtime
        run: python scripts/vendor_elkjs.py

      - name: Sync project dependencies
        run: uv sync --locked

      - name: Run quality gates
        env:
          SKIP: pytest-check
        run: uv run pre-commit run --all-files

      - name: Run test suite with coverage
        run: uv run --locked pytest --cov=src/flo --cov-report=term-missing --cov-fail-under=90

      - name: Build package
        run: |
          uv build --out-dir dist --sdist
          uv build --out-dir dist --wheel
          uv run twine check --strict dist/*
          uv run python scripts/check_release_artifacts.py dist/*.whl dist/*.tar.gz
          uv build dist/*.tar.gz --wheel --out-dir .tmp/sdist-wheel
          uv run twine check --strict .tmp/sdist-wheel/*.whl
          uv run python scripts/check_release_artifacts.py .tmp/sdist-wheel/*.whl

      - name: Smoke-test sdist-built wheel
        run: |
          python -m venv .tmp/publish-sdist-smoke
          .tmp/publish-sdist-smoke/bin/python -m pip install .tmp/sdist-wheel/*.whl
          .tmp/publish-sdist-smoke/bin/python scripts/smoke_installed_imports.py
          .tmp/publish-sdist-smoke/bin/python scripts/check_yb_journey.py --flo "$PWD/.tmp/publish-sdist-smoke/bin/flo"

      - name: Smoke-test wheel install
        run: |
          python -m venv .tmp/publish-smoke
          .tmp/publish-smoke/bin/python -m pip install --upgrade pip
          .tmp/publish-smoke/bin/python -m pip install dist/*.whl
          .tmp/publish-smoke/bin/python scripts/smoke_installed_imports.py
          .tmp/publish-smoke/bin/flo --help
          cd .tmp
          publish-smoke/bin/flo new publish-smoke.flo --name "Publish Smoke"
          publish-smoke/bin/flo validate publish-smoke.flo
          publish-smoke/bin/flo render publish-smoke.flo --diagram sppm --render-to publish-smoke.svg
          test -s publish-smoke.svg
          publish-smoke/bin/python ../scripts/check_yb_journey.py --flo "$(pwd)/publish-smoke/bin/flo"

      - name: Check candidate architecture before publication
        run: >-
          .tmp/publish-smoke/bin/python scripts/architecture_trace.py
          --installed-python "$PWD/.tmp/publish-smoke/bin/python"
          --output .tmp/architecture-validation.json --check

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/flo-lang
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
