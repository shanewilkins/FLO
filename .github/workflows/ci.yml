name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: 'true'

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Install and vendor ELK runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/vendor_elkjs.py

      - name: Sync locked development dependencies
        run: uv sync --locked

      - name: Build and validate distributions
        run: |
          uv build --out-dir dist --sdist
          uv build --out-dir dist --wheel
          uv run twine check --strict dist/*
          uv run python scripts/check_release_artifacts.py dist/*.whl dist/*.tar.gz
          uv build dist/*.tar.gz --wheel --out-dir .tmp/sdist-wheel
          uv run twine check --strict .tmp/sdist-wheel/*.whl
          uv run python scripts/check_release_artifacts.py .tmp/sdist-wheel/*.whl

      - name: Smoke-test installed wheels
        run: |
          python -m venv .tmp/ci-wheel-smoke
          .tmp/ci-wheel-smoke/bin/python -m pip install dist/*.whl
          .tmp/ci-wheel-smoke/bin/python scripts/smoke_installed_imports.py
          .tmp/ci-wheel-smoke/bin/flo --help
          .tmp/ci-wheel-smoke/bin/python scripts/check_yb_journey.py --flo "$PWD/.tmp/ci-wheel-smoke/bin/flo"
          .tmp/ci-wheel-smoke/bin/python scripts/architecture_trace.py --installed-python "$PWD/.tmp/ci-wheel-smoke/bin/python" --output .tmp/ci-wheel-smoke-architecture.json --check
          python -m venv .tmp/ci-sdist-smoke
          .tmp/ci-sdist-smoke/bin/python -m pip install .tmp/sdist-wheel/*.whl
          .tmp/ci-sdist-smoke/bin/python scripts/smoke_installed_imports.py
          .tmp/ci-sdist-smoke/bin/python scripts/check_yb_journey.py --flo "$PWD/.tmp/ci-sdist-smoke/bin/flo"

      - name: Retain Linux candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-candidate-evidence
          path: |
            dist/
            .tmp/sdist-wheel/
            .tmp/ci-wheel-smoke-architecture.json

  macos-package-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Install and vendor ELK runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python scripts/vendor_elkjs.py

      - name: Build and exercise installed wheel
        run: |
          uv build --wheel
          python -m venv .tmp/macos-wheel-smoke
          .tmp/macos-wheel-smoke/bin/python -m pip install dist/*.whl
          .tmp/macos-wheel-smoke/bin/python scripts/smoke_installed_imports.py
          .tmp/macos-wheel-smoke/bin/flo --help
          .tmp/macos-wheel-smoke/bin/python scripts/check_yb_journey.py --flo "$PWD/.tmp/macos-wheel-smoke/bin/flo"
          .tmp/macos-wheel-smoke/bin/python scripts/architecture_trace.py --installed-python "$PWD/.tmp/macos-wheel-smoke/bin/python" --output .tmp/macos-wheel-smoke-architecture.json --check

      - name: Set up Chrome for font measurements
        id: macos-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Measure SVG glyph bounds and publication scaling
        env:
          CHROME_PATH: ${{ steps.macos-chrome.outputs.chrome-path }}
        run: |
          # setup-chrome flattens the macOS bundle into its tool-cache directory.
          # Keep the .app layout so sandboxed helpers can find the parent service.
          chrome_bundle="$RUNNER_TEMP/Google Chrome for Testing.app"
          ditto "$(dirname "$(dirname "$CHROME_PATH")")" "$chrome_bundle/Contents"
          .tmp/macos-wheel-smoke/bin/python scripts/check_svg_browser.py \
            --browser "$chrome_bundle/Contents/MacOS/Google Chrome for Testing" \
            --output .tmp/macos-font-metrics.json

      - name: Retain macOS candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-candidate-evidence
          path: |
            dist/*.whl
            .tmp/macos-wheel-smoke-architecture.json
            .tmp/macos-font-metrics.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Install Node runtime deps (elkjs)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify elkjs runtime import
        run: node --input-type=module -e "await import('elkjs/lib/elk.bundled.js'); console.log('elkjs import ok')"

      - name: Sync locked development dependencies
        run: uv sync --locked

      - name: Run pre-commit hooks (match local pre-commit)
        env:
          SKIP: pytest-check
        run: uv run pre-commit run --all-files

      - name: Run test suite with coverage
        run: uv run --locked pytest --cov=src/flo --cov-report=term-missing --cov-fail-under=90

      - name: Set up Chrome for SVG consumer smoke
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Open maintained SVG in headless Chrome
        run: |
          mkdir -p .tmp/browser-smoke
          uv run flo render examples/reference/washnfold.flo --diagram sppm --sppm-output-profile book --render-to .tmp/browser-smoke/washnfold.svg
          "${{ steps.setup-chrome.outputs.chrome-path }}" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --screenshot=.tmp/browser-smoke/washnfold.png "file://${{ github.workspace }}/.tmp/browser-smoke/washnfold.svg"
          test -s .tmp/browser-smoke/washnfold.png

      - name: Measure SVG glyph bounds and publication scaling
        run: >-
          uv run python scripts/check_svg_browser.py
          --browser "${{ steps.setup-chrome.outputs.chrome-path }}" --no-sandbox
          --output .tmp/browser-smoke/font-metrics.json

      - name: Retain Linux browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-browser-evidence
          path: .tmp/browser-smoke/
